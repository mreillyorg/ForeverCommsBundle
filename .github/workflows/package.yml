name: Package Forever Comms bundle (BigWigs)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Empty on a tag, so the per-addon builds upload. "-d" (skip uploading) on anything
  # else, so the same packaging path is exercised by every push without publishing.
  # CurseForge files cannot be unpublished, so this gate must stay.
  UPLOAD_FLAG: ${{ startsWith(github.ref, 'refs/tags/') && '' || '-d' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The WoW client embeds Lua 5.1, so test against exactly that dialect. Not LuaJIT
      # and not 5.3/5.4: both are supersets that would let a harness come to depend on
      # something the client does not have.
      - name: Install Lua 5.1 and luacheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check
          lua5.1 -v
          luac5.1 -v
          luacheck --version

      - name: Enforce Lua 5.1 syntax, tests and zero-warning lint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_lua_quality.py --lua lua5.1 --luac luac5.1 --luacheck luacheck

      # The combined bundle is for GitHub only, never CurseForge: the three addons are
      # three separate CurseForge projects and are uploaded individually below.
      #
      # -d skips all uploading. -p 0 additionally unsets any CurseForge project id: this
      # build has no ForeverCommsBundle.toc, so release.sh would otherwise fall back to a
      # move-folders TOC and pick up one of the three addons' X-Curse-Project-ID, which
      # would publish the whole bundle to that single addon's project. -d alone prevents
      # that today; -p 0 keeps it prevented if -d is ever removed.
      - name: Build installable bundle with BigWigsMods/packager
        uses: BigWigsMods/packager@v2
        with:
          args: -d -p 0

      - name: Check release structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_bigwigs_bundle.py

      # include-hidden-files is required, not optional. From v4.4 onwards
      # actions/upload-artifact excludes hidden files by default, and it treats ANY path
      # component beginning with a dot as hidden -- so `.release/*.zip` matches nothing
      # and the step reports "No files were found with the provided path". The packager
      # writes to .release by design, hence the opt-in.
      #
      # It stayed hidden until 0.7.2-beta because the release structure check above failed
      # in every earlier run, so this step had never actually executed.
      #
      # The glob is deliberately narrow. release.sh also reads an optional .release/.env
      # holding upload tokens, so do not widen this path to .release or .release/* .
      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: forever-comms-bigwigs-bundle
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true

      # Each addon is its own CurseForge project, so each needs its own archive built from
      # its own folder and .pkgmeta. -t points release.sh at the addon directory; it then
      # finds that directory's .pkgmeta and writes to <addon>/.release, so these builds
      # cannot disturb the bundle already verified above.
      #
      # The project ids live in each addon's own TOC as X-Curse-Project-ID. Uploading only
      # happens on a tag: an untagged run has no version to publish, and CurseForge files
      # cannot be unpublished, so this must never fire on a branch push.
      # Each addon is its own CurseForge project, so each needs its own archive.
      #
      # These builds run on EVERY run, not just tags, and only the upload is gated. An
      # earlier attempt used `-t <addon>`, which cannot work -- release.sh requires a .git
      # directory at its topdir, so it refuses a subdirectory with "No Git, SVN, or Hg
      # checkout found" -- and because the step was tag-only, that was discovered by a
      # failed release rather than by a test run. Building unconditionally means the
      # packaging path is exercised by ordinary pushes; UPLOAD_FLAG adds -d (skip
      # uploading) whenever this is not a tag.
      #
      # topdir is therefore the repository root, and each config under tools/pkgmeta/
      # excludes everything that is not its own addon. check_bigwigs_bundle.py asserts
      # those lists stay complete. Each build gets its own release directory so none of
      # them can disturb the bundle in .release that was verified above.
      - name: Stage the curated changelog for the per-addon builds
        shell: bash
        run: |
          set -euo pipefail
          for addon in ForeverCommsVoice ForeverGuildComms ForeverGroupComms; do
            cp CHANGELOG.md "$addon/CHANGELOG.md"
          done

      - name: Package ForeverCommsVoice
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: >-
            -m tools/pkgmeta/ForeverCommsVoice.yaml
            -r ${{ github.workspace }}/.release-ForeverCommsVoice
            ${{ env.UPLOAD_FLAG }}

      - name: Package ForeverGuildComms
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: >-
            -m tools/pkgmeta/ForeverGuildComms.yaml
            -r ${{ github.workspace }}/.release-ForeverGuildComms
            ${{ env.UPLOAD_FLAG }}

      - name: Package ForeverGroupComms
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: >-
            -m tools/pkgmeta/ForeverGroupComms.yaml
            -r ${{ github.workspace }}/.release-ForeverGroupComms
            ${{ env.UPLOAD_FLAG }}

      - name: Check each per-addon archive
        shell: bash
        run: |
          set -euo pipefail
          for addon in ForeverCommsVoice ForeverGuildComms ForeverGroupComms; do
            dir=".release-$addon"
            zip=$( find "$dir" -maxdepth 1 -name '*.zip' -print -quit )
            [ -n "$zip" ] || { echo "no archive built for $addon" >&2; exit 1; }
            echo "== $addon: $zip"
            top=$( unzip -Z1 "$zip" | cut -d/ -f1 | sort -u )
            [ "$top" = "$addon" ] || {
              echo "expected only $addon at top level, got: $top" >&2; exit 1; }
            unzip -Z1 "$zip" | grep -q "^$addon/$addon.toc$" || {
              echo "$addon.toc missing from the archive" >&2; exit 1; }
          done

      - name: Publish tag as GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" .release/*.zip --generate-notes --verify-tag
