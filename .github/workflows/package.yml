name: Build Forever Comms suite
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all four source ZIPs without external packagers
        run: python tools/package.py --output dist
      - name: Verify archive contents and dependency packaging
        run: python tools/verify_package.py dist
      - name: Publish run artifacts (works without a tag)
        uses: actions/upload-artifact@v4
        with:
          name: forever-comms-packages
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach packages to GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --verify-tag
