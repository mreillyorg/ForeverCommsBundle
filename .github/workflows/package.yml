name: Package Forever Comms bundle (BigWigs)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The WoW client embeds Lua 5.1, so test against exactly that dialect. Not LuaJIT
      # and not 5.3/5.4: both are supersets that would let a harness come to depend on
      # something the client does not have.
      - name: Install Lua 5.1 and luacheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check
          lua5.1 -v
          luac5.1 -v
          luacheck --version

      - name: Enforce Lua 5.1 syntax, tests and zero-warning lint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_lua_quality.py --lua lua5.1 --luac luac5.1 --luacheck luacheck

      - name: Build installable bundle with BigWigsMods/packager
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Check release structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_bigwigs_bundle.py

      # include-hidden-files is required, not optional. From v4.4 onwards
      # actions/upload-artifact excludes hidden files by default, and it treats ANY path
      # component beginning with a dot as hidden -- so `.release/*.zip` matches nothing
      # and the step reports "No files were found with the provided path". The packager
      # writes to .release by design, hence the opt-in.
      #
      # It stayed hidden until 0.7.2-beta because the release structure check above failed
      # in every earlier run, so this step had never actually executed.
      #
      # The glob is deliberately narrow. release.sh also reads an optional .release/.env
      # holding upload tokens, so do not widen this path to .release or .release/* .
      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: forever-comms-bigwigs-bundle
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish tag as GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" .release/*.zip --generate-notes --verify-tag
