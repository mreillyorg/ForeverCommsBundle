name: Package ForeverGuildComms

on:
  push:
    tags:
      - 'v*'

# Required to attach the ZIP to a GitHub Release using the built-in token.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # GitHub publishing works without adding any repository secrets.
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: define tokens as repository secrets and add real
      # project IDs to the TOC to publish to these other services.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Check out full Git history (for tags and changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and publish tagged release
        uses: BigWigsMods/packager@v2
