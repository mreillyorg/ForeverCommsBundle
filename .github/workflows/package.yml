name: Package Forever Comms bundle (BigWigs)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The WoW client embeds Lua 5.1, so test against exactly that dialect. Not LuaJIT
      # and not 5.3/5.4: both are supersets that would let a harness come to depend on
      # something the client does not have.
      - name: Install Lua 5.1 and luacheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 luacheck
          lua5.1 -v
          luac5.1 -v
          luacheck --version

      - name: Verify Lua 5.1 syntax across addon sources
        shell: bash
        run: |
          set -euo pipefail
          find ForeverCommsVoice ForeverGuildComms ForeverGroupComms \
            -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p

      - name: Run all offline harnesses under Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_tests.py --lua lua5.1

      - name: Run luacheck (zero warnings)
        shell: bash
        run: |
          set -euo pipefail
          luacheck . --codes --max-warnings 0

      - name: Build installable bundle with BigWigsMods/packager
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Check release structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_bigwigs_bundle.py

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: forever-comms-bigwigs-bundle
          path: .release/*.zip
          if-no-files-found: error

      - name: Publish tag as GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" .release/*.zip --generate-notes --verify-tag
